<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">Secure IoT Edge  runtime flow</title>
  <desc id="flowDesc">End-to-end sequence from boot through provisioning, cloud connect, telemetry, and OTA confirm.</desc>
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#22d3ee"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="url(#bg2)"/>
  <text x="480" y="34" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600">How the Project Works  Runtime Flow</text>
  <text x="480" y="56" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="13">From cold boot to confirmed OTA image</text>

  <!-- Timeline rail -->
  <line x1="60" y1="200" x2="900" y2="200" stroke="#334155" stroke-width="4" stroke-linecap="round"/>

  <!-- Steps -->
  <g font-family="Segoe UI, system-ui, sans-serif">
    <circle cx="80" cy="200" r="22" fill="#1e40af" stroke="#60a5fa" stroke-width="2"/>
    <text x="80" y="206" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">1</text>
    <text x="80" y="148" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Power on</text>
    <text x="80" y="248" text-anchor="middle" fill="#94a3b8" font-size="9">ROM ’ MCUboot</text>
    <text x="80" y="262" text-anchor="middle" fill="#94a3b8" font-size="9">verify signature</text>

    <circle cx="220" cy="200" r="22" fill="#1e40af" stroke="#60a5fa" stroke-width="2"/>
    <text x="220" y="206" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">2</text>
    <text x="220" y="148" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">App start</text>
    <text x="220" y="248" text-anchor="middle" fill="#94a3b8" font-size="9">Zephyr init</text>
    <text x="220" y="262" text-anchor="middle" fill="#94a3b8" font-size="9">threads + NVS</text>

    <circle cx="360" cy="200" r="22" fill="#0e7490" stroke="#22d3ee" stroke-width="2"/>
    <text x="360" y="206" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">3</text>
    <text x="360" y="148" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">BLE provision</text>
    <text x="360" y="248" text-anchor="middle" fill="#94a3b8" font-size="9">GATT SSID/PSK</text>
    <text x="360" y="262" text-anchor="middle" fill="#94a3b8" font-size="9">save to NVS</text>

    <circle cx="500" cy="200" r="22" fill="#0e7490" stroke="#22d3ee" stroke-width="2"/>
    <text x="500" y="206" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">4</text>
    <text x="500" y="148" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Wi-Fi + DHCP</text>
    <text x="500" y="248" text-anchor="middle" fill="#94a3b8" font-size="9">station join</text>
    <text x="500" y="262" text-anchor="middle" fill="#94a3b8" font-size="9">IPv4 ready</text>

    <circle cx="640" cy="200" r="22" fill="#166534" stroke="#4ade80" stroke-width="2"/>
    <text x="640" y="206" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">5</text>
    <text x="640" y="148" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">MQTT cloud</text>
    <text x="640" y="248" text-anchor="middle" fill="#94a3b8" font-size="9">JSON telemetry</text>
    <text x="640" y="262" text-anchor="middle" fill="#94a3b8" font-size="9">cmd topic</text>

    <circle cx="780" cy="200" r="22" fill="#854d0e" stroke="#fbbf24" stroke-width="2"/>
    <text x="780" y="206" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">6</text>
    <text x="780" y="148" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">FOTA confirm</text>
    <text x="780" y="248" text-anchor="middle" fill="#94a3b8" font-size="9">after MQTT OK</text>
    <text x="780" y="262" text-anchor="middle" fill="#94a3b8" font-size="9">boot_write_img</text>

    <circle cx="900" cy="200" r="22" fill="#581c87" stroke="#c084fc" stroke-width="2"/>
    <text x="900" y="206" text-anchor="middle" fill="#fff" font-size="13" font-weight="600"></text>
    <text x="900" y="148" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Steady state</text>
    <text x="900" y="248" text-anchor="middle" fill="#94a3b8" font-size="9">periodic publish</text>
    <text x="900" y="262" text-anchor="middle" fill="#94a3b8" font-size="9">diag + PM idle</text>
  </g>

  <!-- Connectors on rail -->
  <line x1="102" y1="200" x2="198" y2="200" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="242" y1="200" x2="338" y2="200" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="382" y1="200" x2="478" y2="200" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="522" y1="200" x2="618" y2="200" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="662" y1="200" x2="758" y2="200" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="802" y1="200" x2="878" y2="200" stroke="#22d3ee" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Actors box -->
  <rect x="60" y="300" width="840" height="72" rx="8" fill="#334155" fill-opacity="0.5" stroke="#475569"/>
  <text x="80" y="324" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600">Parallel tasks</text>
  <text x="80" y="348" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="10">connectivity thread: BLE ’ Wi-Fi ’ MQTT  ·  main loop: diagnostics, FOTA confirm, power backoff</text>
  <text x="80" y="364" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="10">mqtt thread: connect / subscribe / publish sensor JSON every CONFIG_SECURE_IOT_EDGE_MQTT_PUBLISH_INTERVAL</text>
</svg>
