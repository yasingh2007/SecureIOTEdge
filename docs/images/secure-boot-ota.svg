<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="bootTitle bootDesc">
  <title id="bootTitle">Secure IoT Edge  boot and OTA</title>
  <desc id="bootDesc">Flash layout and signed update path with MCUboot dual slots.</desc>
  <rect width="960" height="340" fill="#0f172a"/>
  <text x="480" y="36" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="600">Secure Boot &amp; Over-the-Air Updates</text>
  <text x="480" y="58" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="13">MCUboot sysbuild · signed images · swap slots</text>

  <!-- Flash bar -->
  <text x="80" y="92" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">On-chip flash partitions (see boards/*.overlay)</text>
  <rect x="80" y="100" width="120" height="56" rx="4" fill="#422006" stroke="#fbbf24"/>
  <text x="140" y="124" text-anchor="middle" fill="#fef3c7" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600">mcuboot</text>
  <text x="140" y="142" text-anchor="middle" fill="#fcd34d" font-family="Segoe UI, system-ui, sans-serif" font-size="9">verify + swap</text>

  <rect x="210" y="100" width="200" height="56" rx="4" fill="#14532d" stroke="#4ade80"/>
  <text x="310" y="124" text-anchor="middle" fill="#dcfce7" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600">slot0 (running)</text>
  <text x="310" y="142" text-anchor="middle" fill="#86efac" font-family="Segoe UI, system-ui, sans-serif" font-size="9">signed app image</text>

  <rect x="420" y="100" width="200" height="56" rx="4" fill="#1e3a5f" stroke="#38bdf8"/>
  <text x="520" y="124" text-anchor="middle" fill="#e0f2fe" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600">slot1 (staging)</text>
  <text x="520" y="142" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, system-ui, sans-serif" font-size="9">new OTA image</text>

  <rect x="630" y="100" width="120" height="56" rx="4" fill="#312e81" stroke="#a78bfa"/>
  <text x="690" y="124" text-anchor="middle" fill="#ede9fe" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="600">NVS</text>
  <text x="690" y="142" text-anchor="middle" fill="#c4b5fd" font-family="Segoe UI, system-ui, sans-serif" font-size="9">Wi-Fi creds</text>

  <!-- OTA flow -->
  <text x="80" y="200" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Update path (build-time sign with imgtool · runtime via MCUmgr optional)</text>
  <rect x="80" y="212" width="160" height="44" rx="6" fill="#334155" stroke="#64748b"/>
  <text x="160" y="238" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="10">CI signs .bin</text>

  <text x="260" y="238" fill="#22d3ee" font-family="Segoe UI, system-ui, sans-serif" font-size="18">’</text>

  <rect x="280" y="212" width="160" height="44" rx="6" fill="#334155" stroke="#64748b"/>
  <text x="360" y="238" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="10">Download to slot1</text>

  <text x="460" y="238" fill="#22d3ee" font-family="Segoe UI, system-ui, sans-serif" font-size="18">’</text>

  <rect x="480" y="212" width="160" height="44" rx="6" fill="#334155" stroke="#64748b"/>
  <text x="560" y="238" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="10">Reboot · MCUboot test</text>

  <text x="660" y="238" fill="#22d3ee" font-family="Segoe UI, system-ui, sans-serif" font-size="18">’</text>

  <rect x="680" y="212" width="200" height="44" rx="6" fill="#422006" stroke="#fbbf24"/>
  <text x="780" y="238" text-anchor="middle" fill="#fef3c7" font-family="Segoe UI, system-ui, sans-serif" font-size="10">MQTT OK ’ confirm image</text>

  <text x="480" y="300" text-anchor="middle" fill="#64748b" font-family="Segoe UI, system-ui, sans-serif" font-size="10">Implementation: sysbuild.conf · src/fota/fota_manager.c · docs/fota.md</text>
</svg>
